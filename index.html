.w{max-width:620px;margin:0 auto;padding:18px 18px 96px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:30px}
.logo{font-weight:600;letter-spacing:-.02em}

.m.b{background:var(--card)}.m.u{background:var(--ink);color:var(--bg);margin-left:auto}
.ib{display:flex;gap:8px}.ib input{flex:1;min-width:0}

/* Cutfit fitting-room visual refresh */
:root{--bg:#101010;--card:#1b1b1b;--ink:#f5f5f5;--mute:#a5a5a5;--line:#303030;--sk:#444;--sh:#292929;color-scheme:dark}
body{background:#101010;color:#f5f5f5}.w{max-width:1180px;padding:22px 22px 125px}header{border:0;margin-bottom:28px;padding:4px 0 14px}.logo{font-size:1.55rem;font-weight:700;letter-spacing:-.07em}

h1{font-size:clamp(2rem,5vw,3rem)}.lead{color:#aaa}.btn{background:#f5f5f5;color:#111;border-color:#f5f5f5;font-weight:650}.btn.alt{background:transparent;color:#f5f5f5;border-color:#555}.chip{border-color:#454545;color:#eee}.chip[aria-pressed=true]{background:#f5f5f5;color:#111}.cd,.previewbox,.scanring,.hint{background:#1b1b1b;border-color:#333}input,select{background:#202020;color:#f5f5f5;border-color:#444}
.fitting-room{max-width:1120px;margin:0 auto}.fit-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:12px 0 22px}.fit-heading .eyebrow{color:#aaa;letter-spacing:.16em}.fit-heading h1{margin:5px 0 8px}.save-pill,.try-again{border:1px solid #555;background:#292929;color:#fff;border-radius:999px;padding:11px 17px;font:inherit;cursor:pointer;white-space:nowrap}
.fit-stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(150px,.9fr) 78px;gap:10px;align-items:stretch}.fit-main{min-width:0;position:relative;border:1px solid #333;border-radius:22px;overflow:hidden;background:#181818}.fit-image-wrap{position:relative;background:#171717;min-height:320px}#trycv{width:100%;height:auto;max-height:620px;object-fit:contain;border-radius:0;background:#111}.view-tag,.angle-label{position:absolute;bottom:12px;right:12px;background:#222d;color:#fff;border:1px solid #ffffff24;border-radius:20px;padding:7px 12px;font-size:.75rem;letter-spacing:.04em}.fit-caption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;background:#171717}.fit-cut{display:flex;align-items:center;gap:10px;min-width:0}.fit-cut strong,.fit-cut small{display:block}.fit-cut strong{font-size:1rem}.fit-cut small{font-size:.8rem;color:#aaa;margin-top:2px}.checkmark{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#f5f5f5;color:#111;font-weight:800}.try-again{font-size:.82rem;padding:9px 12px}
.fit-angles{display:grid;grid-template-rows:1fr 1fr auto;gap:9px;min-width:0}.angle-card{position:relative;min-height:140px;border:1px solid #383838;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#d8d2c9,#a9a39a)}.angle-art{height:100%;min-height:140px;display:flex;align-items:center;justify-content:center}.angle-art svg{height:100%;width:100%;max-height:190px}.angle-note{font-size:.68rem;line-height:1.35;color:#999;margin:0}.fit-tools{display:flex;flex-direction:column;gap:10px}.tool-btn{border:1px solid #303030;border-radius:19px;background:#202020;color:#f5f5f5;min-height:76px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.tool-btn span{font-size:1.5rem;line-height:1}.tool-btn small{font-size:.68rem;color:#ddd}
.fit-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:13px 0;padding:13px 15px;border:1px solid #343434;border-radius:16px;background:#1a1a1a}.fit-controls label{font-size:.82rem;color:#bbb}.fit-controls input{max-width:180px;accent-color:#fff}.fit-controls select{min-width:145px}.fit-shelf-heading{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.fit-shelf-heading strong,.fit-shelf-heading small{display:block}.fit-shelf-heading small{font-size:.8rem;color:#999;margin-top:3px}.text-action{border:0;background:none;color:#ddd;text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer}.try-carousel{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:10px;overflow-x:auto;padding:2px 2px 10px}.try-card{position:relative;min-width:0;overflow:hidden;border:1px solid #393939;border-radius:17px;background:#222;color:#fff;padding:7px 7px 10px;text-align:center;cursor:pointer}.try-card[aria-pressed=true]{border:2px solid #f5f5f5;box-shadow:0 0 0 2px #fff2}.try-card svg{width:100%;height:100px;display:block}.try-card span{display:block;font-size:.76rem;line-height:1.2}.try-card .picked{position:absolute;right:7px;top:7px;background:#fff;color:#111;width:22px;height:22px;border-radius:50%;font-weight:800;display:grid;place-items:center}.fit-status{font-size:.78rem;color:#999;margin:10px 0}.fit-bottom-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 20px}.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.w{padding:15px 12px 120px}.fit-heading{margin:5px 2px 16px}.fit-heading .lead{font-size:.88rem}.save-pill{padding:9px 12px}.fit-stage{grid-template-columns:minmax(0,1fr) 66px;gap:7px}.fit-main{grid-row:1;grid-column:1}.fit-angles{grid-column:1;grid-row:2;grid-template-columns:1fr 1fr auto;align-items:stretch}.angle-card{min-height:108px}.angle-art{min-height:108px}.angle-art svg{max-height:120px}.angle-note{max-width:85px;align-self:center;font-size:.62rem}.fit-tools{grid-column:2;grid-row:1/3}.tool-btn{min-height:74px;border-radius:16px}.tool-btn small{font-size:.62rem}#trycv{max-height:520px}.fit-caption{padding:10px}.fit-cut strong{font-size:.88rem}.fit-cut small{font-size:.72rem}.try-again{font-size:.72rem;padding:8px}.try-carousel{grid-template-columns:repeat(6,112px);gap:8px}#nv{width:calc(100% - 16px);border-radius:20px;padding:6px}#nv button{font-size:.65rem;padding:8px 2px}}

/* AI-style consultation workflow inspired by the supplied barber-studio demo */
.consult-card{margin:20px 0 16px;padding:20px;border:1px solid #393939;border-radius:22px;background:linear-gradient(145deg,#1d1d1f,#141414)}
.consult-head h2{margin:4px 0;font-size:1.55rem}.consult-head .eyebrow,.analysis-top .eyebrow{letter-spacing:.16em;color:#c9aebc;font-size:.72rem}
.consult-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:16px}
.consult-grid label{display:grid;gap:7px;color:#c7c7c7;font-size:.82rem}
